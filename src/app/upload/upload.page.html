<ion-content class="app-bg">

  <div class="page-container">

    <!-- HEADER -->
    <div class="upload-header">

      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>

      <div>
        <h2>Upload Document</h2>
        <p>Add encrypted files securely</p>
      </div>

    </div>

    <!-- UPLOAD CARD -->
    <div class="glass-card upload-card">

      <!-- PERSON -->
      <div class="section-label">
        Person
      </div>

      <ion-item lines="none" class="app-input">
        <ion-select   #memberSelect

          [(ngModel)]="selectedMemberId"
          interface="action-sheet"
          placeholder="Select Person">

          <ion-select-option
            *ngFor="let m of members"
            [value]="m.id">

            {{ m.name }}

          </ion-select-option>

        </ion-select>

        <ion-button
          slot="end"
          fill="clear"
          size="small"
          (click)="addMemberPrompt()">
          + Add
        </ion-button>
      </ion-item>

      <!-- CATEGORY -->
      <div class="section-label">
        Category
      </div>

      <ion-item lines="none" class="app-input">

        <ion-select
          [(ngModel)]="selectedCategoryId"
          (ionChange)="onCategoryChange()"
          interface="action-sheet"
          placeholder="Select Category">

          <ion-select-option
            *ngFor="let c of categories"
            [value]="c.id">

            {{ c.name }}

          </ion-select-option>

        </ion-select>

      </ion-item>

      <!-- TYPE -->
      <div class="section-label" *ngIf="types.length > 0">
        Type
      </div>

      <ion-item
        lines="none"
        class="app-input"
        *ngIf="types.length > 0">

        <ion-select
          [(ngModel)]="selectedTypeId"
          interface="action-sheet"
          placeholder="Select Type">

          <ion-select-option
            *ngFor="let t of types"
            [value]="t.id">

            {{ t.name }}

          </ion-select-option>

        </ion-select>

      </ion-item>

      <!-- FILE PREVIEW -->
<!-- FILE PREVIEW -->

<div
  class="selected-files"
  *ngIf="selectedFileNames.length > 0">

<!-- FILE PREVIEW -->

<div
  class="preview-grid"
  *ngIf="selectedFilesPreview.length > 0">

  <div
    class="preview-card"
    *ngFor="
      let file of selectedFilesPreview;
      let i = index
    ">

    <!-- IMAGE -->

    <img
      *ngIf="file.type.startsWith('image/')"
      [src]="file.url"
      (click)="openLocalPreview(file)">

    <!-- PDF -->

    <div
      class="pdf-preview"
      *ngIf="file.type.includes('pdf')"
      (click)="openLocalPreview(file)">

      <ion-icon
        name="document-outline">
      </ion-icon>

      <span>PDF</span>

    </div>

    <!-- REMOVE -->

    <div
      class="remove-btn"
      (click)="removeFile(i)">

      <ion-icon
        name="close-outline">
      </ion-icon>

    </div>

  </div>

</div>

</div>

      <!-- HIDDEN INPUT -->
      <input
        type="file"
        multiple
        hidden
        #fileInput
        (change)="onFilesSelected($event)">

      <!-- SELECT BUTTON -->
      <ion-button
        expand="block"
        class="select-btn"
        (click)="openOptions(fileInput)">

        <ion-icon slot="start" name="attach-outline"></ion-icon>

        Select Files

      </ion-button>

      <!-- UPLOAD BUTTON -->
      <ion-button
        expand="block"
        class="upload-btn"
        (click)="upload()">

        <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>

        Upload Securely

      </ion-button>

    </div>
<!-- UPLOAD OVERLAY -->

<div
  class="upload-overlay"
  *ngIf="isUploading">

  <div class="upload-box">

    <div class="upload-icon">
      🔐
    </div>

    <h3>
      Securing Files
    </h3>

    <p>
      {{ uploadMessage }}
    </p>

    <div class="progress-bar">

      <div
        class="progress-fill"
        [style.width.%]="uploadProgress > 100 ? 100 : (uploadProgress < 0 ? 0 : uploadProgress)">

      </div>

    </div>

    <div class="progress-text">
      {{ uploadProgress > 100 ? 100 : (uploadProgress < 0 ? 0 : uploadProgress) }}%
    </div>

  </div>

</div>
  </div>

</ion-content>
