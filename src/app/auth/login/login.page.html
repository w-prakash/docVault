<ion-content class="app-bg">

  <!-- BACKGROUND GLOW -->
  <div class="login-glow"></div>

  <div class="login-container">

    <!-- TOP -->
    <div class="login-header">

      <div class="logo-circle">
        🔒
      </div>

      <h1>Welcome Back</h1>

      <p>
        Access your secure encrypted vault
      </p>

    </div>

    <!-- LOGIN CARD -->
    <div class="glass-card login-card">

      <ion-button
        expand="block"
        class="login-btn"
        (click)="loginWithGoogle()"
        [disabled]="isLoading">

        <ion-spinner
          *ngIf="isLoading"
          slot="start"
          name="crescent">
        </ion-spinner>

        {{
          isLoading
            ? 'Signing In...'
            : 'Sign in with Google'
        }}

      </ion-button>

      <p class="login-error" *ngIf="error">
        {{ error }}
      </p>

    </div>

  </div>

</ion-content>
