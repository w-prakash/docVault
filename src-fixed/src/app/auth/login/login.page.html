<ion-content class="app-bg" [fullscreen]="true">

  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <svg class="deco deco-left" viewBox="0 0 200 300" fill="none">
    <path d="M0 40 C 60 20, 90 80, 180 60" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
    <path d="M0 90 C 60 70, 90 130, 180 110" stroke="url(#g1)" stroke-width="1" opacity="0.25"/>
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5b8cff"/>
        <stop offset="1" stop-color="transparent"/>
      </linearGradient>
    </defs>
  </svg>

  <span class="dot dot-1"></span>
  <span class="dot dot-2"></span>
  <span class="ring ring-1"></span>
  <span class="ring ring-2"></span>

  <div class="login-container">

    <div class="login-header">

      <div class="icon-halo">
        <div class="icon-ring"></div>
        <div class="icon-ring icon-ring-dotted"></div>
        <div class="shield">
          <svg viewBox="0 0 24 24" width="46" height="46">
            <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z"
                  fill="url(#shieldGrad)" stroke="#eaf1ff" stroke-width="0.6"/>
            <rect x="8.7" y="11.2" width="6.6" height="5.4" rx="1.2" fill="#eef3ff"/>
            <path d="M10 11.2 V9.4 a2 2 0 0 1 4 0 v1.8" fill="none" stroke="#eef3ff" stroke-width="1.3"/>
            <circle cx="12" cy="13.6" r="0.9" fill="#0a0e27"/>
            <defs>
              <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5ec8ff"/>
                <stop offset="0.5" stop-color="#5b7bff"/>
                <stop offset="1" stop-color="#8b5cff"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <h1 class="title">Welcome <span class="grad-text">Back</span></h1>

      <p class="subtitle">
        Access your secure encrypted vault<br/>
        anytime, anywhere.
      </p>

    </div>

    <div class="feature-card">

      <div class="feature">
        <div class="feature-icon feature-icon-blue">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7db8ff" stroke-width="1.8">
            <path d="M12 3 L19 6 V11 C19 15.5 16 19 12 21 C8 19 5 15.5 5 11 V6 Z"/>
            <path d="M9 12 L11 14 L15.5 9.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="feature-label">End-to-End<br/>Encrypted</span>
        <span class="feature-underline underline-blue"></span>
      </div>

      <div class="feature-divider"></div>

      <div class="feature">
        <div class="feature-icon feature-icon-purple">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c39bff" stroke-width="1.8">
            <path d="M7 16 a4 4 0 0 1 0 -8 a5 5 0 0 1 9.6 -1.6 A4.2 4.2 0 0 1 17 16 Z"/>
            <rect x="10.3" y="13.8" width="3.4" height="3" rx="0.6"/>
          </svg>
        </div>
        <span class="feature-label">Access Anywhere<br/>Anytime</span>
        <span class="feature-underline underline-purple"></span>
      </div>

      <div class="feature-divider"></div>

      <div class="feature">
        <div class="feature-icon feature-icon-green">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5be8b5" stroke-width="1.6">
            <path d="M12 3 C15 3 17.5 5.5 17.5 9 C17.5 14 15 18 12 21 C9 18 6.5 14 6.5 9 C6.5 5.5 9 3 12 3 Z" opacity="0.5"/>
            <path d="M9 9 a3 3 0 0 1 6 0 v3" stroke-linecap="round"/>
            <path d="M9.5 12 v2.5 M12 13 v3 M14.5 12 v2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="feature-label">Your Data<br/>Stays Private</span>
        <span class="feature-underline underline-green"></span>
      </div>

    </div>

    <div class="glass-card login-card">

      <div class="secure-badge">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3l6 2.5V11c0 4.5-2.7 8-6 9.5-3.3-1.5-6-5-6-9.5V5.5L12 3z" fill="#4f7cff"/></svg>
        <span>Secure Login</span>
      </div>

      <ion-button
        expand="block"
        class="google-btn"
        (click)="loginWithGoogle()"
        [disabled]="isLoading">

        <span class="google-btn-content">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

          <svg *ngIf="!isLoading" width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.6 0-14.1 4.3-17.7 10.6z"/>
            <path fill="#4CAF50" d="M24 44.5c5.4 0 10.2-1.9 13.9-5.1l-6.4-5.4C29.4 35.5 26.9 36 24 36c-5.4 0-9.9-3.1-11.4-7.5l-6.6 5.1C9.6 40.1 16.3 44.5 24 44.5z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3.2 5.5-6.2 7l6.4 5.4C39.5 37.3 44.5 31.5 44.5 24c0-1.2-.1-2.4-.3-3.5z"/>
          </svg>

          <span class="google-btn-text">{{ isLoading ? 'Signing In...' : 'Sign in with Google' }}</span>

          <svg *ngIf="!isLoading" class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2">
            <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>

      </ion-button>

      <p class="login-error" *ngIf="error">{{ error }}</p>

      <div class="footnote">
        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3l6 2.5V11c0 4.5-2.7 8-6 9.5-3.3-1.5-6-5-6-9.5V5.5L12 3z" fill="none" stroke="#6b7fa8" stroke-width="1.4"/></svg>
        <span>We never store your password</span>
      </div>

    </div>

    <div class="footer">
      <span class="hairline"></span>
      <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3l6 2.5V11c0 4.5-2.7 8-6 9.5-3.3-1.5-6-5-6-9.5V5.5L12 3z" fill="#4f7cff"/></svg>
      <span class="footer-text">Your security is our priority</span>
      <span class="hairline"></span>
    </div>

  </div>

</ion-content>
